<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gravação e Transcrição</title>
    <!-- Inclusão do Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Seu CSS personalizado (se necessário) -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container mt-4">
        <h1 class="text-center">Gravar Áudio para Relatórios</h1>
        
        <!-- Botão grande para gravar -->
        <button id="btnGravar" class="btn btn-success btn-lg btn-block">Gravar</button>
        
        <!-- Área para exibir a transcrição -->
        <div id="transcricao" class="mt-4 p-3 border rounded" style="background-color: #f8f9fa;">
            <h2>Transcrição:</h2>
            <p id="textoTranscricao">Aperte para falar.</p>
        </div>
        
        <!-- Botões para navegar para Relatórios e Gráficos -->
        <div id="navegacao" class="mt-4 d-flex justify-content-between">
            <a href="{{ url_for('relatorios') }}" class="btn btn-primary">Ver Relatórios</a>
            <a href="{{ url_for('graficos') }}" class="btn btn-primary">Ver Gráficos</a>
        </div>
    </div>
    
    <!-- Inclusão do Bootstrap JS e dependências -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.min.js"></script>
    
    <!-- Seu script de gravação -->
    <script src="{{ url_for('static', filename='recorder.js') }}"></script>
    
    <script>
        const btnGravar = document.getElementById('btnGravar');
        const textoTranscricao = document.getElementById('textoTranscricao');
        
        // Função para alternar o estado do botão e texto durante a gravação
        btnGravar.addEventListener('click', function() {
            if (btnGravar.classList.contains('btn-success')) {
                // Mudando para "Gravando"
                btnGravar.classList.remove('btn-success');
                btnGravar.classList.add('btn-danger');
                btnGravar.textContent = "Gravando...";
                textoTranscricao.textContent = "Gravando, por favor fale...";
            } else {
                // Mudando para "Feito"
                btnGravar.classList.remove('btn-danger');
                btnGravar.classList.add('btn-success');
                btnGravar.textContent = "Gravar";
                textoTranscricao.textContent = "Transcrição concluída!";
            }
        });
    </script>
</body>
</html>
